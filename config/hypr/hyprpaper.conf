# =============================================================================
#  ContinuityOS — wallpaper daemon
# =============================================================================
#  Out of the box the palette is DARK: near-black gradients with a soft accent
#  glow, so the light-coloured app icons and the translucent drawer have real
#  contrast to sit on.
#
#  The three shipped wallpapers (continuity-dark-01/02/03.png) live in
#  ~/.local/share/continuity/assets/wallpapers/ and are installed by
#  `install.sh --user`. Pick a different one with:
#      hyprctl hyprpaper wallpaper ",/path/to/image.png"
#      hyprctl hyprpaper reload   # after editing this file
#
#  hyprlang expands $HOME here, so these paths work for every user.
#  If a wallpaper is missing, hyprpaper logs an error and keeps the previous
#  one — the session still starts.
# =============================================================================

# Keep the parsed images in memory so switching back is instant.
preload = $HOME/.local/share/continuity/assets/wallpapers/continuity-dark-01.png
preload = $HOME/.local/share/continuity/assets/wallpapers/continuity-dark-02.png
preload = $HOME/.local/share/continuity/assets/wallpapers/continuity-dark-03.png

# An empty monitor name applies the wallpaper to every output.
# Default: the deepest, calmest gradient. "fit" never crops the composition.
wallpaper = ,$HOME/.local/share/continuity/assets/wallpapers/continuity-dark-01.png

# Compositing knobs.
splash = false        # no splash text over the wallpaper
ipc = on              # allow hyprctl hyprpaper ... (used by continuity-panel)

# Wallpaper sizing modes understood by the `wallpaper` keyword:
#   cover  - fill the screen, cropping overflow (default, best for photos)
#   contain- fit inside the screen, leaving letterbox bars
#   tile   - repeat the image pixel-aligned
