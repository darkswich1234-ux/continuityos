# =============================================================================
#  ContinuityOS — idle behaviour (hypridle)
# =============================================================================
#  Phone-like escalation: lock at 5 minutes, screen off at 8, suspend at 30.
#  All three listeners are skipped while a game or video holds an idle
#  inhibitor (idleinhibit), which is why the gaming rules in
#  conf.d/rules.conf set `idleinhibit fullscreen` for steam_app_* and gamescope.
#
#  Check the daemon is alive with: systemctl --user status hypridle
# =============================================================================

general {
    # lock_cmd runs when the session is asked to lock from outside (loginctl,
    # the power menu, a lid switch). `pidof` may not exist on a minimal install,
    # so pgrep is used instead.
    lock_cmd = pgrep -x hyprlock || hyprlock

    # Called just before the machine suspends — lock first, then sleep, so the
    # desktop is never briefly visible on resume.
    before_sleep_cmd = loginctl lock-session

    # Called after waking: bring the panel back up.
    after_sleep_cmd = hyprctl dispatch dpms on

    # Respect apps that ask not to be interrupted (video, games, installers).
    ignore_dbus_inhibit = false

    # Do not lock while a game is in the foreground.
    ignore_systemd_inhibit = true
}

# 1) Lock: a phone locks its screen long before it sleeps.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 2) Panel off: saves the most power on OLED and LED-backlit panels alike.
listener {
    timeout = 480
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 3) Suspend: only after the session has been idle for half an hour.
#    `systemctl suspend` is used instead of `systemctl suspend-then-hibernate`
#    so machines without a configured swapfile resume predictably.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
