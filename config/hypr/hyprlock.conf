# =============================================================================
#  ContinuityOS — lock screen (hyprlock)
# =============================================================================
#  A blurred, darkened version of the same dark wallpaper with a big rounded
#  clock and a pill-shaped password field — the visual language of a phone lock
#  screen.
#
#  Test it without locking yourself out (run from a TTY or a spare terminal):
#      hyprlock --immediate
# =============================================================================

general {
    hide_cursor = true
    # Ignore the first 2 seconds of input so a stray keypress on the way to the
    # locker is not swallowed as a password attempt.
    grace = 2
    # Fail-safe: if the auth helper dies, do not leave the screen unlocked.
    no_fade_in = false
}

# --- background -------------------------------------------------------------
background {
    monitor =
    path = $HOME/.local/share/continuity/assets/wallpapers/continuity-dark-01.png
    color = rgba(0b0e14ff)
    # Heavy blur + darkening so text always has contrast, on any wallpaper.
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 1.05
    brightness = 0.55
    vibrancy = 0.18
    vibrancy_darkness = 0.12
}

# --- big clock --------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ecf1f8ff)
    font_size = 120
    font_family = Inter
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(8a94a6ff)
    font_size = 22
    font_family = Inter
    position = 0, 40
    halign = center
    valign = center
}

# --- password field ---------------------------------------------------------
input-field {
    monitor =
    size = 320, 56
    position = 0, -120
    halign = center
    valign = center

    # Pill shape, matching the quick-settings widgets in the drawer.
    rounding = 28
    outline_thickness = 2
    outer_color = rgba(8bc4ffcc)
    inner_color = rgba(141822f2)
    font_color = rgba(ecf1f8ff)
    font_family = Inter
    font_size = 18

    # PIN-dot styling instead of a plain caret.
    dots_center = true
    dots_size = 0.26
    dots_spacing = 0.3
    dots_rounding = 4

    # NOTE: a single '#' starts a hyprlang comment, so literal colours inside a
    # value must be written with a doubled hash ('##rrggbb').
    placeholder_text = <span foreground="##8a94a6">Enter password</span>
    fail_text = <span foreground="##ff6b81">Wrong password</span>

    fade_on_empty = true
    hide_input = false

    # Small hint of the account being unlocked.
    check_color = rgba(7ee787cc)
    fail_color = rgba(ff6b81cc)
}

# --- session buttons --------------------------------------------------------
# A single "lock / logout" affordance in the corner, styled like a small chip.
label {
    monitor =
    text = cmd[update:60000] whoami
    color = rgba(8a94a6ff)
    font_size = 14
    font_family = Inter
    position = 0, -40
    halign = center
    valign = bottom
}
