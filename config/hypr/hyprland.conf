# =============================================================================
#  ContinuityOS — Hyprland session
# =============================================================================
#  This file is deliberately thin. It declares variables, monitors, environment
#  and then pulls in everything under conf.d/. Add your own tweaks as a new
#  conf.d/*.conf file instead of growing this one.
#
#  SYNTAX: ContinuityOS ships the hyprlang ".conf" syntax. Hyprland 0.55+ still
#  reads it (and additionally accepts a Lua config, hyprland.lua) while hyprlang
#  is deprecated over time. These files stay the source of truth for
#  ContinuityOS; see docs/HYPRLAND-LUA-MIGRATION.md if you convert by hand.
#
#  SHELL: the bar (Waybar), the dock/quick-settings drawer (Eww), the wallpaper
#  daemon (hyprpaper) and notifications (dunst) are all started by a single
#  bootstrap script, so this config never has to know about them:
#      exec-once = /usr/local/bin/continuity-session-start
# =============================================================================

# --- variables ---------------------------------------------------------------
# $mainMod is re-declared at the top of conf.d/keybinds.conf as well, so that
# file stays readable (and valid) on its own.
$mainMod     = SUPER

# Default applications referenced by conf.d/keybinds.conf.
$terminal    = foot
$fileManager = thunar
$menu        = rofi -show drun
$browser     = xdg-open

# ContinuityOS asset root — wallpapers/icons live here.
$assets      = $HOME/.local/share/continuity/assets

# --- monitors ----------------------------------------------------------------
# Wildcard: any output gets its preferred mode at its preferred refresh rate and
# is placed automatically. For per-machine overrides drop a
# conf.d/monitors.local.conf with explicit `monitor = DP-1, 2560x1440@144, 0x0, 1`
# style lines — `source` globs are sorted, so a `z`-prefixed file wins.
monitor = , preferred, auto, auto

# --- environment -------------------------------------------------------------
# Wayland-first, with XWayland/X11 as a graceful fallback for older apps.
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,ContinuityOS
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# Chromium/Electron pick Wayland when available, otherwise x11.
env = QT_QPA_PLATFORM,wayland;wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,0
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = _JAVA_AWT_WM_NONREPARENTING,1
env = CLUTTER_BACKEND,wayland
# Firefox/GTK use the ContinuityOS dark palette by default.
env = GTK_THEME,Adwaita:dark
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

# --- configuration layers ----------------------------------------------------
# 1. Everything under conf.d/ (glob, sources in sorted order):
#    animations.conf  decoration.conf  gaming.conf  input.conf
#    keybinds.conf    rules.conf       autostart.conf
source = $HOME/.config/hypr/conf.d/*.conf

# 2. Re-assert the fluid "normal mode" look. conf.d/gaming.conf is the lean
#    parity overlay that continuity-gaming-mode mirrors at runtime through
#    hyprctl; because the glob above loads it unconditionally, the base look is
#    applied last so that a fresh session always starts pretty. Toggling
#    gameplay mode is a *runtime* switch, never a config edit.
source = $HOME/.config/hypr/conf.d/animations.conf
source = $HOME/.config/hypr/conf.d/decoration.conf

# 3. Optional per-user overlay, ignored when absent. Use it for machine-specific
#    monitors/cursor/keybind tweaks you do not want under version control.
source = $HOME/.config/hypr/local.conf

# --- security ----------------------------------------------------------------
# Hyprland 0.4x+ gates some IPC behind permission blocks. ContinuityOS tools
# (continuity-session-start, continuity-gaming-mode, continuity-panel) talk to
# the live instance over the socket, so allow the local user's own scripts.
permission = /usr/local/bin/continuity-.*, screencopy, allow
permission = /usr/local/bin/continuity-.*, plugin, allow
