# =============================================================================
#  ContinuityOS — input devices & gestures
# =============================================================================
#  Laptop-first defaults: a touchpad that behaves like a phone trackpad, and
#  three-finger horizontal swipes that move between workspaces the way Android
#  swipes between home screens.
#
#  Per-machine overrides (keyboard layout, extra keyboards) belong in
#  ~/.config/hypr/local.conf, which hyprland.conf sources last.
# =============================================================================

input {
    # --- keyboard ------------------------------------------------------------
    kb_layout  = us
    kb_variant =
    kb_model   =
    kb_options = compose:caps
    kb_rules   =
    numlock_by_default = true

    # Windows-style repeat feels more natural to people migrating from Windows.
    repeat_delay = 400
    repeat_rate  = 40

    # --- mouse ---------------------------------------------------------------
    follow_mouse  = 1
    sensitivity   = 0
    # Flat (1:1) acceleration: predictable for games, no mushy desktop pointers.
    accel_profile = flat
    force_no_accel = true

    # --- touchpad ------------------------------------------------------------
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        # Two-finger right click (clickfinger) instead of bottom-edge zones.
        clickfinger_behavior = true
        scroll_factor = 1.0
        # NOTE: `tap-to-click` is the long-standing name; Hyprland >= 0.53 also
        # accepts `tap_to_click`. Harmless if your build prefers the latter name.
        tap-to-click = true
        middle_button_emulation = true
        drag_lock = false
    }

    # --- tablets / touchscreens ---------------------------------------------
    # Pen and touch input feel native to the Android-like shell.
    touchdevice {
        transform = 0
    }
}

# --- gestures ---------------------------------------------------------------
# Hyprland's current hyprlang gesture binding: three-finger horizontal swipes
# move between workspaces.
gesture = 3, horizontal, workspace
