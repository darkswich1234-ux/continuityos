# =============================================================================
#  ContinuityOS — decoration, layout, input-adjacent globals
# =============================================================================
#  Rounded corners, translucent blurred surfaces, tight-but-breathable gaps and
#  a dark Material-You-flavoured palette. This is the file to tweak when the
#  desktop looks "off" rather than "wrong".
# =============================================================================

# --- general ----------------------------------------------------------------
general {
    # Floating/tiling hybrids: mobile-like gaps around and between windows.
    gaps_in  = 5
    gaps_out = 10

    border_size = 2
    # Accent gradient on the focused window, muted slate when unfocused.
    col.active_border   = rgba(8bc4ffdd) rgba(9d7bffdd) 45deg
    col.inactive_border = rgba(2a2f3a99)

    # Mobile/tablet-like: dragging near an edge resizes instead of moving.
    resize_on_border    = true
    extend_border_grab_area = 14
    hover_icon_on_border = true

    # Tiling policy. dwindle = BSP tree (predictable splits);
    # switch to `master` if you prefer one big "hero" window + a side stack.
    layout = dwindle

    snap {
        enabled = true
        window_gap = 6
        monitor_gap = 6
    }
}

# --- decoration -------------------------------------------------------------
decoration {
    rounding = 16
    # Higher power = squircle-ish (continuous) corners instead of pure arcs.
    rounding_power = 2.2

    active_opacity   = 1.0
    inactive_opacity = 0.97
    fullscreen_opacity = 1.0

    # Dimming inactive windows kills the "clean" look on OLED panels.
    dim_inactive = false
    dim_strength = 0.08

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        # xray avoids blurring the window stack behind each translucent surface,
        # which keeps the drawer/dock cheap on integrated GPUs.
        xray = true
        noise = 0.02
        contrast = 1.05
        brightness = 1.0
        vibrancy = 0.2019
        vibrancy_darkness = 0.1
        popups = true
        popups_ignorealpha = 0.2
        special = false
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000055)
        color_inactive = rgba(00000033)
        offset = 0 4
        scale = 0.98
    }
}

# --- layouts ----------------------------------------------------------------
dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
    # 2 = prefer splitting along the longer side (feels calmer on wide screens).
    force_split = 2
    special_scale_factor = 0.9
}

master {
    new_status = master
    new_on_top = false
    mfact = 0.55
    special_scale_factor = 0.9
}

# --- misc -------------------------------------------------------------------
misc {
    # No Hyprland branding: the session should look like a product, not a WM.
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = 0xb00b0e14

    vrr = 1

    focus_on_activate = true
    # Manual resizes are cheap; animating them fights the user's mouse.
    animate_manual_resizes = false
    animate_mouse_windowdragging = true

    # Let the screen wake on input instead of staying dark after idle.
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true

    enable_swallow = false
    middle_click_paste = false

    # Keep config reloads explicit: continuity-gaming-mode flips this to true
    # while gaming so an unrelated save cannot re-enable effects mid-game.
    disable_autoreload = false

    close_special_on_empty = true

    # The Android-like chrome (drawer, dock, toasts) assumes Inter is present;
    # install.sh installs ttf-inter with the desktop package set.
    font_family = Inter
}

# --- binds ------------------------------------------------------------------
binds {
    workspace_back_and_forth = true
    allow_workspace_cycles = true
    pass_mouse_when_bound = false
    scroll_event_delay = 300
    hide_special_on_workspace_change = true
    # 1 = focus follows the mouse's window on the target workspace.
    focus_preferred_method = 1
    ignore_group_lock = false
    movefocus_cycles_fullscreen = false
}

# --- cursor -----------------------------------------------------------------
cursor {
    inactive_timeout = 5
    no_warps = false
}

# --- xwayland ---------------------------------------------------------------
xwayland {
    enabled = true
    # Old Windows-era apps (and Wine/Proton titles) usually assume 96 DPI; this
    # keeps them crisp on HiDPI displays instead of blurry.
    force_zero_scaling = true
    use_nearest_neighbor = false
}
