# =============================================================================
#  ContinuityOS — keybinds
# =============================================================================
#  A deliberately small, memorable set: navigation on $mainMod + arrows/vim keys,
#  media keys work out of the box, and the ContinuityOS shell entrypoints are
#  reachable without a terminal.
#
#  Bind flags: bind = repeat, bindm = mouse, binde = repeat+release (volume),
#  bindr = on release only (push-to-talk style), bindl = locked (media keys).
# =============================================================================

$mainMod     = SUPER
$terminal    = foot
$fileManager = thunar
$menu        = rofi -show drun

# --- session & shell --------------------------------------------------------
# App drawer (Android-like): centered searchable launcher.
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, D,     exec, $menu

# Quick-settings drawer — Wi-Fi / Bluetooth / audio / performance sliders.
bind = $mainMod, W,     exec, /usr/local/bin/continuity-panel toggle drawer
# Notification shade.
bind = $mainMod, N,     exec, /usr/local/bin/continuity-panel toggle notifications
# Power menu (lock / logout / suspend / reboot / shutdown).
bind = $mainMod, ESCAPE, exec, /usr/local/bin/continuity-panel toggle power

# Gaming mode: strips animations, blur, bar and background indexers.
bind = $mainMod, G,     exec, /usr/local/bin/continuity-gaming-mode toggle
# Gaming mode (explicit) for people who want it on a dedicated key.
bind = $mainMod SHIFT, G, exec, /usr/local/bin/continuity-gaming-mode status

# Lock / leave the session.
bind = $mainMod, L,     exec, loginctl lock-session
bind = $mainMod SHIFT, L, exec, /usr/local/bin/continuity-panel toggle power

# --- applications ----------------------------------------------------------
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, E,      exec, $fileManager
# Every Windows app lives in its own folder under this directory; deleting a
# folder uninstalls that app completely.
bind = $mainMod, A,      exec, sh -c 'xdg-open "$HOME/.local/share/universal-prefixes"'

# --- windows ---------------------------------------------------------------
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,        # dwindle: pin split orientation
bind = $mainMod, J, togglesplit,   # dwindle: swap split direction
bind = $mainMod, O, togglespecialworkspace, magic
bind = $mainMod SHIFT, O, movetoworkspace, special:magic
bind = $mainMod, T, togglegroup,   # tabbed window groups

# Focus — arrow keys. (No vim H/J/K/L set: K is "next window", L is the lock
# shortcut, and J/P are split toggles, so arrows stay unambiguous.)
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Cycle windows within a group, and cycle groups on a workspace.
bind = $mainMod, K, cyclegroup
bind = $mainMod SHIFT, K, cyclegroup, b

# Move windows.
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Resize (repeat = hold to keep resizing).
bind = $mainMod CTRL, right, resizeactive, 40 0
bind = $mainMod CTRL, left,  resizeactive, -40 0
bind = $mainMod CTRL, up,    resizeactive, 0 -40
bind = $mainMod CTRL, down,  resizeactive, 0 40

# --- workspaces ------------------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Workspace paging — mobile-like horizontal movement.
bind = $mainMod, TAB,       workspace, e+1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Scroll through workspaces on the bar/dock area.
bind = $mainMod, mouse:272, movewindow
bind = $mainMod, mouse:273, resizewindow

# --- screenshots / screen recording ----------------------------------------
bind = , PRINT, exec, /usr/local/bin/continuity-screenshot full
bind = SHIFT, PRINT, exec, /usr/local/bin/continuity-screenshot region
bind = $mainMod, S, exec, /usr/local/bin/continuity-screenshot region
bind = $mainMod SHIFT, S, exec, /usr/local/bin/continuity-screenshot full
bind = $mainMod CTRL, S, exec, /usr/local/bin/continuity-screenshot window

# --- media, audio, brightness ----------------------------------------------
# binde = fires on press *and* release, so holding a key ramps the value.
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous
bindl  = , XF86AudioStop,  exec, playerctl stop

# Brightness on internal panels; on desktops brightnessctl is a no-op.
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -q s +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q s 5%-

# --- clipboard -------------------------------------------------------------
# $terminal covers the common case; wl-clipboard keeps a shell-independent path.
bind = $mainMod, C, exec, sh -c 'wl-paste -n 2>/dev/null | wl-copy'
bind = $mainMod, X, exec, sh -c 'wl-paste -n 2>/dev/null | wl-copy --primary'
bind = $mainMod, Z, exec, sh -c 'cliphist list | rofi -dmenu | cliphist decode | wl-copy'
bind = $mainMod SHIFT, Z, exec, sh -c 'cliphist wipe'

# --- hardware keys ---------------------------------------------------------
bindl = , XF86PowerOff, exec, /usr/local/bin/continuity-panel toggle power
bindl = , XF86Sleep,    exec, systemctl suspend
bindl = , XF86WLAN,     exec, /usr/local/bin/continuity-panel toggle drawer
bindl = , XF86Bluetooth, exec, /usr/local/bin/continuity-panel toggle drawer
