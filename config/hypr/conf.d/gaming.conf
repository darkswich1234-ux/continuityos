# =============================================================================
#  ContinuityOS — gaming mode (lean look-and-feel)
# =============================================================================
#  This is the *parity reference* for `continuity-gaming-mode on`. The live
#  switch is applied at runtime with hyprctl keywords — it never edits config
#  files — so the desktop can go from "Material You" to "console" and back
#  without a reload. Every value below has an exact matching hyprctl call:
#
#      animations.enabled          -> hyprctl keyword animations:enabled 0
#      decoration.blur.enabled     -> hyprctl keyword decoration:blur:enabled 0
#      decoration.shadow.enabled   -> hyprctl keyword decoration:shadow:enabled 0
#      decoration.rounding         -> hyprctl keyword decoration:rounding 2
#      general.gaps_in/gaps_out    -> hyprctl keyword general:gaps_in 4 / gaps_out 6
#      general.border_size         -> hyprctl keyword general:border_size 1
#      misc.disable_autoreload     -> hyprctl keyword misc:disable_autoreload 1
#
#  WHY THE GLOB DOES NOT BREAK NORMAL MODE
#  hyprland.conf sources conf.d/*.conf (so this file is loaded unconditionally)
#  and then re-sources animations.conf + decoration.conf afterwards, which
#  restores the fluid defaults for a fresh session. The runtime toggle is what
#  actually decides the current mode; this file only keeps the two states
#  documented side by side, one grep away from the script that implements them.
#
#  Do not add this file to local.conf expecting it to pin gaming mode — use
#  `continuity-gaming-mode on` (or Super+G) so the shell and power profile are
#  switched too.
# =============================================================================

animations {
    # No animations at all: every frame belongs to the game.
    enabled = false
}

decoration {
    # Square-ish, hard-edged windows read as "faster".
    rounding = 2

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }

    # Fully opaque: transparency forces extra compositing work.
    active_opacity   = 1.0
    inactive_opacity = 1.0
    dim_inactive = false
}

general {
    # Tight gaps reclaim pixels around the play area.
    gaps_in  = 4
    gaps_out = 6
    border_size = 1
    # No accent gradient cost while a game holds the foreground.
    col.active_border   = rgba(1c2028ff)
    col.inactive_border = rgba(1c2028ff)
}

misc {
    # Freeze config reloads so an unrelated file save cannot re-enable effects
    # in the middle of a match.
    disable_autoreload = true
}
