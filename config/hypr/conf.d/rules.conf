# =============================================================================
#  ContinuityOS — window, layer and workspace rules
# =============================================================================
#  SYNTAX: Hyprland >= 0.53 rewrote the rule system. The current grammar is
#
#      windowrule = match:<field> <regex>, <effect>[, <effect>...]
#      layerrule  = <effect>, match:namespace <name>
#
#  The old `windowrulev2 = <effect>, <class:regex>` form is NOT used here. Rules
#  are evaluated top to bottom, so put narrow rules above broad ones.
# =============================================================================

# --- floating dialogs and small utilities ----------------------------------
# Anything that is a modal "sheet" on a phone becomes a floating card here.
windowrule = match:class ^(org\.pulseaudio\.pavucontrol)$, float, size 60% 70%, center
windowrule = match:class ^(blueman-manager)$, float, size 50% 65%, center
windowrule = match:class ^(nm-connection-editor)$, float, size 50% 65%, center
windowrule = match:class ^(org\.gnome\.Calculator)$, float, size 25% 45%, center
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float, size 70% 70%, center
windowrule = match:class ^(org\.freedesktop\.impl\.portal\.gtk)$, float, size 70% 70%, center
windowrule = match:class ^(nm-applet)$, float, size 30% 40%, center
windowrule = match:class ^(continuity-panel)$, float, center

# ContinuityOS helpers that are really dialogs.
windowrule = match:class ^(continuity-.*)$, float, size 60% 60%, center

# Wine/Proton "please wait" and installer splash windows: never tile them.
windowrule = match:title ^(Wine.*)$, float
windowrule = match:title ^(Proton.*)$, float

# Picture-in-Picture players float and stay above tiles.
windowrule = match:title ^(Picture-in-Picture)$, float, pin, size 30% 30%

# Image/video previewers behave like a phone's quick-look overlay.
windowrule = match:class ^(imv|mpv|org\.gnome\.Loupe|qimgv)$, float, size 70% 75%, center

# --- gaming: maximum frames -------------------------------------------------
# Games should never pay for compositor effects or animations.
windowrule = match:class ^(steam_app_\d+)$, noblur, noanim, immediate, idleinhibit fullscreen
windowrule = match:class ^(gamescope)$, noanim, immediate, idleinhibit fullscreen
windowrule = match:class ^(wine|proton|umu-run)$, noblur
windowrule = match:class ^(heroic|com\.heroicgameslauncher\.Heroic)$, noshadow
# Anything whose title is an .exe came from the Universal Compatibility Engine.
# RE2 puts the case-insensitive flag first (?i), never at the end.
windowrule = match:title (?i)\.exe$, noblur

# --- opacity: light glass on the dark palette -------------------------------
windowrule = match:class ^(foot|kitty|Alacritty|org\.wezfurlong\.wezterm)$, opacity 0.96 0.90
windowrule = match:class ^(code|Code|VSCodium)$, opacity 0.98 0.94
windowrule = match:class ^(thunar|org\.gnome\.Nautilus|dolphin)$, opacity 0.97 0.92

# --- XWayland / portal fixes ------------------------------------------------
# Portal file pickers must not steal keyboard focus from the app that opened
# them, and old X11 apps that hard-resize themselves would fight the tiler.
windowrule = match:class ^(xdg-desktop-portal.*)$, noinitialfocus, float, center
windowrule = match:class ^(org\.freedesktop\.impl\.portal\..*)$, noinitialfocus, float, center
windowrule = match:class ^(.*)$, suppressevent maximize

# --- workspace rules --------------------------------------------------------
# Workspace 1 is the "home screen"; 2-3 are productivity; 4 is creative; 5 is
# gaming. `default:true` only applies when no workspace exists yet.
workspace = 1, default:true, gapsin:5, gapsout:10
workspace = 2, gapsin:5, gapsout:10
workspace = 3, gapsin:5, gapsout:10
workspace = 4, gapsin:5, gapsout:10
workspace = 5, gapsin:4, gapsout:8

# Named special workspace used by Super+O as a scratchpad.
workspace = special:magic, gapsin:8, gapsout:16, on-created-empty:foot

# --- layer rules (shell surfaces) -------------------------------------------
# Namespaces come from the layer-shell clients: Waybar reports "waybar", Eww
# windows use their window name (dock, drawer, notifications), rofi reports
# "rofi".
layerrule = blur on, match:namespace waybar
layerrule = ignorealpha 0.29, match:namespace waybar
# Waybar also reports the bar's own `name` ("continuity-bar") as its namespace on
# newer builds, so match both spellings instead of guessing which is installed.
layerrule = blur on, match:namespace continuity-bar
layerrule = ignorealpha 0.29, match:namespace continuity-bar

layerrule = blur on, match:namespace drawer
layerrule = ignorealpha 0.20, match:namespace drawer

layerrule = blur on, match:namespace dock
layerrule = ignorealpha 0.20, match:namespace dock

layerrule = blur on, match:namespace notifications
layerrule = ignorealpha 0.30, match:namespace notifications

layerrule = blur on, match:namespace rofi
layerrule = ignorealpha 0.10, match:namespace rofi

# The first-run wizard is one window per step (wizard, wizard-steam, …), so match
# the family rather than each name.
layerrule = blur on, match:namespace ^wizard
layerrule = ignorealpha 0.18, match:namespace ^wizard

# ContinuityOS helpers that draw their own surfaces.
layerrule = blur on, match:namespace continuity-.*
layerrule = ignorealpha 0.20, match:namespace continuity-.*
