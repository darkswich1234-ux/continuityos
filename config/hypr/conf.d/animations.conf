# =============================================================================
#  ContinuityOS — animations
# =============================================================================
#  The "fluid device" feel: Material-style emphasized easing, springy window
#  entry, sliding layers, cross-fading workspaces. Short durations keep the
#  desktop feeling instant rather than decorative.
#
#  hyprlang animation grammar:
#      bezier    = NAME, X0, Y0, X1, Y1
#      animation = NAME, ONOFF, SPEED, CURVE[, STYLE]
#  ONOFF is 1/0 (1 = enabled), SPEED is a unitless parameter where *higher is
#  faster*, and STYLE is one of: slide, slidevert, fade, slidefade <percent>,
#  slidefadevert <percent>, popin <percent>. The separate windowsIn/windowsOut
#  and layersIn/layersOut forms control entry and exit independently and take
#  precedence over the combined `windows` / `layers` forms.
#
#  NOTE: Hyprland >= 0.55 prefers a Lua config for new setups; these keywords
#  remain valid in hyprland.conf.
# =============================================================================

animations {
    enabled = yes

    # --- easing curves -------------------------------------------------------
    # Material "emphasized decelerate": quick out, soft landing.
    bezier = continuity,   0.05, 0.90, 0.10, 1.00
    # Slightly springy overshoot for window entry (y1 > 1 = bounce).
    bezier = spring,       0.34, 1.30, 0.64, 1.00
    # Standard ease for fades and border transitions.
    bezier = standard,     0.20, 0.00, 0.00, 1.00
    # Emphasized accelerate for exits ("throwing" a window away).
    bezier = exit,         0.30, 0.00, 0.80, 0.15

    # --- windows -------------------------------------------------------------
    # Android-like: a new app grows in from ~90% while fading.
    animation = windows,     1, 5, spring,     popin 90%
    animation = windowsIn,   1, 5, spring,     popin 92%
    animation = windowsOut,  1, 3, exit,       popin 85%

    # --- layers (bar, dock, drawer, notifications, rofi) ---------------------
    animation = layers,      1, 3, continuity, slide
    animation = layersIn,    1, 4, continuity, slidefade 12%
    animation = layersOut,   1, 3, exit,       slidefade 12%

    # --- workspaces ----------------------------------------------------------
    # Horizontal slide + fade, the way Android swaps home screens.
    animation = workspaces,  1, 5, continuity, slidefade 18%

    # --- everything else -----------------------------------------------------
    animation = fade,        1, 3, standard
    animation = fadeIn,      1, 3, standard
    animation = fadeOut,     1, 3, standard
    animation = border,      1, 8, continuity
    # Slowly rotating active border on focused windows (subtle, low-cost).
    animation = borderangle, 1, 60, standard, loop
}

# Global animation kill-switch parity with `continuity-gaming-mode`:
#   hyprctl keyword animations:enabled 0   # gaming mode on
#   hyprctl keyword animations:enabled 1   # gaming mode off
# Do not set animations:enabled = false here; keep the pretty default and let
# the runtime toggle own the lean state.
