# =============================================================================
#  ContinuityOS — session autostart
# =============================================================================
#  One bootstrap line owns the whole shell: bar, dock, quick-settings drawer,
#  wallpaper, notifications and portals. Keeping it
#  in one script means gaming mode can stop/restart shell pieces without this
#  config file knowing anything about them.
#
#  `exec-once` runs at compositor startup only (and `exec` would re-run on every
#  config reload — use it only for things that are safe to duplicate).
# =============================================================================

# --- the shell --------------------------------------------------------------
exec-once = /usr/local/bin/continuity-session-start

# --- polkit authentication agent --------------------------------------------
# Exactly one agent may run. Pick whichever is installed; `exec-once` is handed
# to /bin/sh -c, so this loop is fine.
exec-once = sh -c 'for a in /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 /usr/lib/hyprpolkitagent/hyprpolkitagent /usr/lib/polkit-kde-authentication-agent-1; do [ -x "$a" ] && exec "$a"; done'

# --- session environment for systemd / dbus-activated services ---------------
# Makes portals and dbus-activated services see the Wayland session, so they
# start in the right context instead of a bare TTY.
exec-once = sh -c 'systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE 2>/dev/null; command -v dbus-update-activation-environment >/dev/null && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE 2>/dev/null; true'

# --- mouse cursor -----------------------------------------------------------
# High-contrast light cursor to match the light icons on the dark palette.
exec-once = /usr/bin/hyprctl setcursor Adwaita 24
