# ContinuityOS — GTK 4 / libadwaita defaults (dark palette, light icons).
#
# Installed to ~/.config/gtk-4.0/settings.ini by install.sh --user.
#
# NOTE: libadwaita apps (GNOME 42+) intentionally ignore gtk-theme-name and follow
# the system colour scheme. That is why the ContinuityOS accent is applied through
# gtk.css (~/.config/gtk-4.0/gtk.css) and, for libadwaita, through the
# prefer-dark + accent settings below, rather than through a theme package.

[Settings]
# Kept for non-libadwaita GTK4 apps (Pavucontrol-qt, some Flatpaks).
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Noto Sans 11
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24

gtk-application-prefer-dark-theme=1
gtk-enable-animations=1

# Header bars: the compositor owns window chrome on Wayland, so hide the
# server-side/clientside double-decoration and keep the layout minimal.
gtk-decoration-layout=:minimize,maximize,close

gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb

# Where libadwaita 1.6+ looks for the user accent before falling back to blue.
gtk-accent-color=#a8c7fa
