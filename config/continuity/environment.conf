# =============================================================================
#  ContinuityOS — user configuration
# =============================================================================
#  Sourced by every continuity-* tool (see continuity_load_env). Only
#  CONTINUITY_* keys are read, and the file must stay owned by you and NOT
#  group/world-writable, otherwise it is ignored for safety.
#
#  Values here are DEFAULTS. Command-line flags always win:
#      continuity-run --proton /my/GE-Proton --game umu-1 game.exe
# =============================================================================

# --- engine -------------------------------------------------------------------
# umu    = run Proton outside Steam with the UMU Steam Linux Runtime (default)
# direct = invoke a host-installed Valve/CachyOS Proton build without UMU
# wine   = plain system Wine (useful for utilities, .msi and .lnk files)
CONTINUITY_DEFAULT_ENGINE=umu

# UMU game ID or Steam-compatible app ID (default 0 disables automatic fixes).
CONTINUITY_GAMEID=0

# Preferred Proton build. A directory, proton script, or installed runner name
# works. Leave unset to auto-detect a Valve Proton installation managed by Steam.
# GE-Proton is not supported for direct non-Steam use upstream; it requires UMU.
#CONTINUITY_PROTONPATH="Proton - Experimental"

# Steam installation root for direct Proton compatibility integration. Auto-detected
# when empty; set this when Steam is installed in a nonstandard location.
#CONTINUITY_STEAM_ROOT=$HOME/.local/share/Steam

# --- launch behaviour ---------------------------------------------------------
# 1 = after any successful launch, scan the prefix and register launchers for
# every executable found inside it (nice for installers, noisy for tools).
CONTINUITY_AUTO_LAUNCHERS=0

# Wrap games in gamescope (requires the gamescope package) and MangoHud.
CONTINUITY_GAMESCOPE=0
CONTINUITY_MANGOHUD=0

# --- paths (uncomment to relocate; both are read before any launch) -----------
#CONTINUITY_PREFIX_ROOT=$HOME/.local/share/universal-prefixes

# --- shell --------------------------------------------------------------------
# 1 = every new session starts in gaming mode (animations off, shell hidden,
# background indexing paused). Set by the first-run wizard's "Gaming" choice;
# Super+G still toggles it live either way.
CONTINUITY_START_IN_GAMING_MODE=0
# Icons for the Eww/Waybar widget scripts: "glyph" (needs a Nerd Font, default)
# or "text" for a plain-text fallback.
CONTINUITY_GLYPH_MODE=glyph
