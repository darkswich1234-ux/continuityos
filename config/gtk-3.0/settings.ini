# ContinuityOS — GTK 3 defaults (dark palette, light icons).
#
# Installed to ~/.config/gtk-3.0/settings.ini by install.sh --user.
# Only theme names that the ContinuityOS package lists actually install are used:
#   Adwaita / Adwaita-dark  -> gnome-themes-extra
#   Papirus-Dark            -> papirus-icon-theme
# adwaita-icon-theme provides the symbolic icons Adwaita-dark falls back to.

[Settings]
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Noto Sans 11
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24

# Dark first, and animations on: the shell's "Android-like" feel depends on
# GTK transitions being enabled for app windows too.
gtk-application-prefer-dark-theme=1
gtk-enable-animations=1

# No client-side decorations in the title bar: Hyprland draws the chrome, the
# rounded corners come from the compositor, and the extra appmenu button only
# adds clutter to a phone-like layout.
gtk-decoration-layout=appmenu:none
gtk-menu-images=1
gtk-button-images=0

# Use the same font rendering as the shell so app text matches Waybar/Eww.
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb

# ContinuityOS reads gtk.css from this directory (see config/continuity/gtk.css,
# symlinked in by install.sh) for the accent colour and rounded surfaces.
gtk-modules=
