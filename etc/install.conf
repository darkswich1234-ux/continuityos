# ContinuityOS — install state
# Read as an EnvironmentFile by systemd (continuity-first-boot.service) and written
# by `install.sh --system`. Keep it KEY=VALUE with no quotes or shell syntax:
# systemd EnvironmentFile parsing (and install.sh's updater) expect that.

# Where the ContinuityOS source tree lives. The ISO embeds the whole repo at
# /opt/continuityos; a git checkout would point at its own path.
CONTINUITY_SOURCE_DIR=/opt/continuityos

# Version of the tree that provisioned this machine.
CONTINUITY_VERSION=0.1.0

# The user whose ~/.config and ~/.local should be provisioned by the user phase.
# Empty means "the user who ran install.sh --user" / $SUDO_USER.
CONTINUITY_TARGET_USER=

# 1 when the install was driven by the live medium's automatic-install path
# (kernel parameter continuityos.install=1).
CONTINUITY_LIVE_INSTALL=0

# 1 to skip the creative suite, 0 for the full profile.
CONTINUITY_GAMING_ONLY=0

# 1 when WinBoat was requested with --with-winboat.
CONTINUITY_WITH_WINBOAT=0

# 1 when this machine boots straight into the desktop (greetd's initial_session),
# which is the default for install.sh --system/--all. 0 means a login prompt is
# kept. Change it with continuity-boot on|off rather than editing this by hand:
# the value is a record of the choice, not the mechanism.
CONTINUITY_AUTOLOGIN=1
