<?xml version="1.0" encoding="UTF-8"?>
<!--
  ContinuityOS — continuity-dark-01 "Deep Field"
  3840x2160. Fully self-contained: no external references, no text, no fonts.
  Designed for a light-icon shell on top: the centre stays below ~14% luminance.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dark abstract space gradient">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#07070d"/>
      <stop offset="0.45" stop-color="#0b0a18"/>
      <stop offset="1"    stop-color="#04040a"/>
    </linearGradient>

    <radialGradient id="nebulaTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0"   stop-color="#1fb6a8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#0f6f86" stop-opacity="0.20"/>
      <stop offset="1"   stop-color="#0f6f86" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0"   stop-color="#7b5cff" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#3a2a8c" stop-opacity="0.16"/>
      <stop offset="1"   stop-color="#3a2a8c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0"   stop-color="#ff8a5c" stop-opacity="0.22"/>
      <stop offset="1"   stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>

    <filter id="soften" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="180"/>
    </filter>
    <filter id="softenMore" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="320"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.035"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#base)"/>

  <!-- nebulae -->
  <g filter="url(#softenMore)">
    <ellipse cx="1180" cy="820"  rx="1180" ry="900" fill="url(#nebulaTeal)"/>
    <ellipse cx="2860" cy="1420" rx="1080" ry="760" fill="url(#nebulaViolet)"/>
    <ellipse cx="2380" cy="420"  rx="620"  ry="440" fill="url(#nebulaWarm)"/>
  </g>

  <!-- low-contrast horizon band -->
  <g filter="url(#soften)" opacity="0.5">
    <path d="M0 1560 C 900 1420, 2100 1700, 3840 1480 L3840 2160 L0 2160 Z" fill="#0a1024"/>
    <path d="M0 1240 C 1100 1180, 2600 1330, 3840 1180" stroke="#2ae0c8" stroke-opacity="0.10"
          stroke-width="3" fill="none"/>
  </g>

  <!-- starfield: generated once, no randomness at render time -->
  <g fill="#e8f4ff">
    <circle cx="312"  cy="288"  r="1.8" opacity="0.55"/>
    <circle cx="864"  cy="146"  r="2.4" opacity="0.42"/>
    <circle cx="1462" cy="384"  r="1.5" opacity="0.62"/>
    <circle cx="1980" cy="212"  r="2.0" opacity="0.35"/>
    <circle cx="2446" cy="486"  r="1.6" opacity="0.50"/>
    <circle cx="2984" cy="268"  r="2.6" opacity="0.38"/>
    <circle cx="3496" cy="560"  r="1.7" opacity="0.58"/>
    <circle cx="578"  cy="742"  r="2.2" opacity="0.44"/>
    <circle cx="1226" cy="1024" r="1.4" opacity="0.60"/>
    <circle cx="1704" cy="880"  r="2.8" opacity="0.30"/>
    <circle cx="2260" cy="1120" r="1.6" opacity="0.52"/>
    <circle cx="2764" cy="932"  r="2.1" opacity="0.41"/>
    <circle cx="3320" cy="1188" r="1.5" opacity="0.56"/>
    <circle cx="402"  cy="1524" r="2.3" opacity="0.36"/>
    <circle cx="1042" cy="1720" r="1.7" opacity="0.48"/>
    <circle cx="1560" cy="1900" r="2.0" opacity="0.33"/>
    <circle cx="2144" cy="1642" r="1.4" opacity="0.58"/>
    <circle cx="2688" cy="1848" r="2.5" opacity="0.29"/>
    <circle cx="3208" cy="1690" r="1.6" opacity="0.50"/>
    <circle cx="3696" cy="1992" r="2.0" opacity="0.34"/>
    <circle cx="180"  cy="1044" r="1.3" opacity="0.52"/>
    <circle cx="3560" cy="884"  r="1.9" opacity="0.45"/>
  </g>

  <!-- grain + vignette keep the panel edges calm under light icons -->
  <rect width="3840" height="2160" filter="url(#grain)" opacity="0.6"/>
  <rect width="3840" height="2160" fill="url(#vignette)"/>
</svg>
