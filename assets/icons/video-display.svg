<?xml version="1.0" encoding="UTF-8"?>
<!--
  ContinuityOS asset — CC0-1.0
  video-display.svg — display/media surfaces: screenshot notifications, ArtCraft
  (PhotoCraft/FilmCraft) launchers, and the "desktop effects restored" notice that
  gaming mode sends when it turns off.

  Design: a monitor with a play triangle on a translucent dark plate. Light frame,
  accent action, symmetric enough to look intentional at small sizes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"
     role="img" aria-labelledby="title vdDesc">
  <title id="title">Display and media</title>
  <desc id="vdDesc">A monitor showing a play triangle.</desc>

  <defs>
    <linearGradient id="vdPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b20" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#101014" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="vdScreen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2a2f3a"/>
      <stop offset="1" stop-color="#161a22"/>
    </linearGradient>
    <filter id="vdShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="220" height="220" rx="52" fill="#000000" opacity="0.35" filter="url(#vdShadow)"/>
  <rect x="16" y="16" width="220" height="220" rx="52" fill="url(#vdPlate)"
        stroke="#43474e" stroke-width="2"/>

  <!-- monitor -->
  <rect x="52" y="66" width="152" height="104" rx="14" fill="url(#vdScreen)"
        stroke="#e6e1e5" stroke-width="8"/>

  <!-- play triangle in the accent colour -->
  <path d="M112 96 L152 118 L112 140 Z" fill="#a8c7fa" stroke="#a8c7fa"
        stroke-width="6" stroke-linejoin="round"/>

  <!-- stand -->
  <g fill="#e6e1e5">
    <rect x="116" y="170" width="24" height="18" rx="4"/>
    <rect x="86"  y="188" width="84" height="12" rx="6"/>
  </g>
</svg>
