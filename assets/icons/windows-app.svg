<?xml version="1.0" encoding="UTF-8"?>
<!--
  ContinuityOS asset — CC0-1.0
  windows-app.svg — default icon for discovered Windows executables that carry no
  extractable icon of their own. Referenced by bin/continuity-prefix when it writes
  Icon=$HOME/.local/share/continuity/assets/icons/windows-app.svg into a launcher.

  Design: a light gel-style four-pane window mark on a translucent dark plate, so it
  reads on #101014 and on the mid-dark regions of the wallpaper pack alike. Drawn from
  scratch as a generic pane grid — not a copy of any vendor logo.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"
     role="img" aria-labelledby="title windowsAppDesc">
  <title id="title">Windows application</title>
  <desc id="windowsAppDesc">A four-pane window mark on a dark rounded plate.</desc>

  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#1b1b20" stop-opacity="0.92"/>
      <stop offset="1"   stop-color="#101014" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e1e5"/>
    </linearGradient>
    <linearGradient id="paneAccent" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#c6dbff"/>
      <stop offset="1" stop-color="#a8c7fa"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- backing plate keeps the glyph legible over any wallpaper -->
  <rect x="18" y="18" width="220" height="220" rx="52" fill="#000000" opacity="0.35" filter="url(#softShadow)"/>
  <rect x="16" y="16" width="220" height="220" rx="52" fill="url(#plate)"
        stroke="#43474e" stroke-width="2"/>

  <!-- four panes: the top-left one carries the accent so the mark has a focal point -->
  <g>
    <rect x="60"  y="62"  width="62" height="62" rx="10" fill="url(#paneAccent)"/>
    <rect x="134" y="62"  width="62" height="62" rx="10" fill="url(#pane)"/>
    <rect x="60"  y="136" width="62" height="62" rx="10" fill="url(#pane)"/>
    <rect x="134" y="136" width="62" height="62" rx="10" fill="url(#pane)"/>
  </g>

  <!-- window sill: the hint that this is an application, not a logo -->
  <rect x="60" y="206" width="136" height="6" rx="3" fill="#a8c7fa" opacity="0.55"/>
</svg>
