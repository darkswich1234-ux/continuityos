<?xml version="1.0" encoding="UTF-8"?>
<!--
  ContinuityOS asset — CC0-1.0
  input-gaming.svg — gaming-mode indicator, used by the quick-settings drawer's
  Performance segment, gaming-mode notifications and the shell's status surfaces.

  Design: a gamepad in light grey gel style with two accent buttons, on a translucent
  dark plate. Deliberately chunky so it stays readable at 16–22px in a bar/drawer.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"
     role="img" aria-labelledby="title igDesc">
  <title id="title">Gaming mode</title>
  <desc id="igDesc">A gamepad with two highlighted buttons.</desc>

  <defs>
    <linearGradient id="igPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b20" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#101014" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="igBody" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9d5dc"/>
    </linearGradient>
    <filter id="igShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="220" height="220" rx="52" fill="#000000" opacity="0.35" filter="url(#igShadow)"/>
  <rect x="16" y="16" width="220" height="220" rx="52" fill="url(#igPlate)"
        stroke="#43474e" stroke-width="2"/>

  <!-- body: two grips joined by a bar -->
  <path d="M74 96 h108 c26 0 40 18 44 44 5 32-6 54-28 54-18 0-26-14-36-26-8-9-16-13-34-13
           -18 0-26 4-34 13-10 12-18 26-36 26-22 0-33-22-28-54 4-26 18-44 44-44 Z"
        fill="url(#igBody)"/>

  <!-- d-pad -->
  <path d="M92 140 h10 v-10 h12 v10 h10 v12 h-10 v10 h-12 v-10 h-10 Z" fill="#101014" opacity="0.85"/>

  <!-- accent buttons -->
  <circle cx="160" cy="140" r="9"  fill="#a8c7fa"/>
  <circle cx="184" cy="164" r="9"  fill="#ffb4ab"/>
  <circle cx="160" cy="188" r="9"  fill="#e6e1e5"/>
  <circle cx="136" cy="164" r="9"  fill="#e6e1e5"/>

  <!-- shoulder hint -->
  <rect x="86" y="88" width="34" height="10" rx="5" fill="#a8c7fa" opacity="0.7"/>
  <rect x="136" y="88" width="34" height="10" rx="5" fill="#e6e1e5" opacity="0.5"/>
</svg>
