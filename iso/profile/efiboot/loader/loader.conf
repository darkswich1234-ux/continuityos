# ContinuityOS — systemd-boot config for the sole (UEFI) boot path.
default 01-continuityos.conf
timeout 5
# "max" keeps the smooth first-boot splash legible on HiDPI panels; drop to
# "auto" if a firmware misbehaves with the graphical console.
console-mode max
editor  no
auto-entries  no
auto-firmware no
