title    ContinuityOS (automatic install - needs continuityos.disk=)
linux    /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
initrd   /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
# continuityos.install=1 triggers /root/.automated_script.sh, which runs
# continuity-installer install … --yes and logs to
# /var/log/continuity-installer.log.
#
# It does NOT guess a disk. Add continuityos.disk=/dev/nvme0n1 to the options
# line below (with optional continuityos.user= and continuityos.host=) and the
# install runs unattended on that disk. Leave it out and this entry behaves like
# the live-desktop entry: the desktop comes up with the guided installer, which
# asks which disk to erase before writing anything.
#
# This replaced a comment that claimed the installer "partitions the first disk
# it is pointed at". Nothing in this repository ever partitioned a disk — the old
# continuityos.install=1 path only configured the running live system in RAM,
# which is why an installed ContinuityOS had to be a hand-installed Arch first.
options  archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=12G quiet continuityos.install=1
