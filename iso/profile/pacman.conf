# ---------------------------------------------------------------------------
# ContinuityOS archiso pacman.conf
#
# Used by mkarchiso for the *build host* transaction, not copied verbatim to
# the installed system. Two things matter here:
#
#   1. [multilib] MUST stay enabled. Wine and the lib32-* graphics stack live
#      there; direct Proton resolves host driver libraries.
#   2. The only third-party repo is [cachyos], for the CachyOS kernel-tuned
#      and gaming packages. Its signing key is pinned in iso/keys/cachyos.gpg
#      and imported by iso/build.sh after a fingerprint check. Other third-party
#      repos (chaotic-aur, ...) are not used; AUR software is added by install.sh
#      explicitly.
# ---------------------------------------------------------------------------

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 8
Color
VerbosePkgLists
ILoveCandy
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# CachyOS comes first so its packages win over the Arch versions they replace.
[cachyos]
Server = https://mirror.cachyos.org/repo/$arch/$repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
