# ---------------------------------------------------------------------------
# ContinuityOS live medium — the account the desktop runs as.
#
# The live system must not be root. Hyprland refuses to run as root, and a
# session only gets its seat, its D-Bus connection and its portals because
# systemd-logind hands them to a real user. So the live medium has exactly one
# human account and autologins into it.
#
# It has NO password on purpose: greetd's [initial_session] does not
# authenticate, and there is nothing on a live medium to protect. That is also
# why /etc/sudoers.d/continuity-live gives it passwordless sudo — the graphical
# installer has to write a disk and has nowhere to ask for a password.
#
# systemd-sysusers creates the user and its home at boot. The live boot hook
# falls back to useradd if this file was somehow not processed, because a live
# medium that boots to a black screen is a worse failure than a duplicated
# account.
#
# The groups: network (so the session can join Wi-Fi through NetworkManager
# without a polkit prompt), and video/render/audio for the graphics stack.
# ---------------------------------------------------------------------------

g     continuity
u     continuity - "ContinuityOS live user" /home/continuity /bin/bash
m     continuity network
m     continuity video
m     continuity render
m     continuity audio
