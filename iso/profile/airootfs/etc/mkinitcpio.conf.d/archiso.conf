# Use Archiso's live-media root discovery instead of the generic systemd root hooks.
# Keep this in sync with /usr/share/archiso/configs/releng/airootfs/etc/mkinitcpio.conf.d/archiso.conf.
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
