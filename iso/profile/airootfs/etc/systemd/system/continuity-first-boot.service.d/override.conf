# ---------------------------------------------------------------------------
# ContinuityOS — drop-in for the first-boot service.
#
# SHIPPED ON THE LIVE MEDIUM, COPIED TO THE TARGET by install.sh, and ignored
# harmlessly if the base unit does not exist (systemd only warns about drop-ins
# for unknown units).
#
# Why the drop-in exists rather than the base unit:
#   * the base unit (continuity-first-boot.service, owned by install.sh) is
#     machine-agnostic;
#   * these settings are specific to an ISO-installed system, where the repo
#     payload lives at /opt/continuityos.
# ---------------------------------------------------------------------------

[Unit]
# Wait for networking before first-boot provisioning.
After=network-online.target

# install.sh writes /etc/continuity/install.conf and keeps it as install state
# (it is the EnvironmentFile the base unit reads). Requiring it means the heavy
# first-boot provisioning only runs on a machine the installer actually finished.
ConditionPathExists=/etc/continuity/install.conf

[Service]
# Where the ISO put the repository payload. install.sh honours this variable and
# falls back to the checkout it was run from.
Environment=CONTINUITY_SOURCE_DIR=/opt/continuityos
# A slow disk (or a slow first-time pacman db refresh) must not make first boot
# look like a failure.
TimeoutStartSec=1800
