# ---------------------------------------------------------------------------
# ContinuityOS live medium — start the desktop, but only once this live root is
# actually prepared.
#
# continuity-live-boot.service installs the continuity-* CLI, the session entry
# and the live user's ~/.config from the embedded payload at /opt/continuityos.
# greetd's [initial_session] command is /usr/local/bin/continuity-shell, so if
# greetd started first it would hand the user a session command that does not
# exist yet and the medium would look dead. The ordering is a dependency, then,
# not a preference:
#
#     continuity-live-boot.service -> greetd.service -> Hyprland (continuity)
#
# greetd's own unit is left untouched (it comes from the greetd package, and
# packaging owns it): this drop-in only adds ordering, and getty@tty1 is NOT
# masked because greetd.service already Conflicts= with it.
#
# There is no greeter at boot: [initial_session] runs the session directly, the
# way a phone does not ask you to log in on power-on. A greeter appears only
# after a logout (or if the session dies), which is what default_session is for.
# ---------------------------------------------------------------------------

[Unit]
After=continuity-live-boot.service systemd-sysusers.service systemd-firstboot.service
Wants=continuity-live-boot.service
